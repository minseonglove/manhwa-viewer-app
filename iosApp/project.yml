name: iosApp
options:
  bundleIdPrefix: com.manhwaviewer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Configuration/Secrets.xcconfig
  Release: Configuration/Secrets.xcconfig

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # 모델은 코드가 번들의 하위 폴더(subdirectory)로 찾으므로 그룹이 아니라 폴더 참조로 넣어 구조를 보존한다.
      - path: ../data/src/iosMain/resources/mangaocr
        type: folder
        buildPhase: resources
      - path: ../data/src/iosMain/resources/hayai
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../libs/lindera/LinderaFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manhwaviewer.app
        INFOPLIST_FILE: iosApp/Info.plist
        DEVELOPMENT_TEAM: PC497J52FF
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../ios-app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LINKER_FLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-larchive"
          - "-lz"
      configs:
        # Info.plist carries this value in plain text, and the development secret must never ship in a Release build.
        Release:
          TRANSLATION_PROXY_DEV_SECRET: ""
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        # TestFlight and App Store builds ignore this and attest in production.
        com.apple.developer.devicecheck.appattest-environment: development
    preBuildScripts:
      - name: "Build KMP Framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ios-app:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  # 기기에서 OCR 파이프라인을 재는 벤치 앱. 앱과 같은 프레임워크·모델을 쓰고, 스토어에 나가는 타깃이 아니다.
  OcrEvalBench:
    type: application
    platform: iOS
    sources:
      - path: OcrEvalBench
      - path: ../data/src/iosMain/resources/mangaocr
        type: folder
        buildPhase: resources
      - path: ../data/src/iosMain/resources/hayai
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../libs/lindera/LinderaFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manhwaviewer.ocrevalbench
        INFOPLIST_FILE: OcrEvalBench/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../ios-app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LINKER_FLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-larchive"
          - "-lz"
    preBuildScripts:
      - name: "Build KMP Framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ios-app:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
