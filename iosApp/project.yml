name: iosApp
options:
  bundleIdPrefix: com.manhwaviewer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Configuration/Secrets.xcconfig
  Release: Configuration/Secrets.xcconfig

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # 모델은 코드가 번들의 하위 폴더(subdirectory)로 찾으므로 그룹이 아니라 폴더 참조로 넣어 구조를 보존한다.
      - path: ../data/src/iosMain/resources/mangaocr
        type: folder
        buildPhase: resources
      - path: ../data/src/iosMain/resources/hayai
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../libs/lindera/LinderaFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manhwaviewer.app
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../ios-app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LINKER_FLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-larchive"
          - "-lz"
    preBuildScripts:
      - name: "Build KMP Framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ios-app:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
