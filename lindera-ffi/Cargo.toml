[package]
name = "lindera-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
lindera = { version = "3.0", features = ["embed-ipadic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", default-features = false, optional = true }

[features]
default = []
android = ["jni"]

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
